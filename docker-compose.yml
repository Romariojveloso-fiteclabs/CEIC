name: ceic

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceic}
      POSTGRES_DB: ${POSTGRES_DB:-ceic}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    networks:
      - ceic_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ceic}:${POSTGRES_PASSWORD:-ceic}@postgres:5432/${POSTGRES_DB:-ceic}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    networks:
      - ceic_net
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

networks:
  ceic_net:
    name: ceic_net

volumes:
  postgres_data:
  media_data:
